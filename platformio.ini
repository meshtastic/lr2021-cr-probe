; LR2021 packet-status coding-rate probe.
;
; One RX + one TX env per host board. Flash RX to one devkit and TX to another,
; then read the RX serial log - it is the whole experiment.
;
; The Semtech LR2021 LoRa Plus EVK (XIAO nRF54L15 host) is the xiao_* pair:
;   pio run -e rx_xiao -t upload
;   pio run -e tx_xiao -t upload
;   pio device monitor -p /dev/serial/by-id/<RX probe's -if02 link> -b 115200
;
; RadioLib is pinned to the exact revision meshtastic/firmware develop uses, so the API
; here matches the firmware that produced the original observations.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	https://github.com/jgromes/RadioLib/archive/5878f990bdb4c95c75494a21562c0c5a49659c6f.zip
build_flags =
	; RADIOLIB_GODMODE exposes setLoRaModulationParams(), readRegMem32(),
	; writeRegMemMask32() and getVersion(), which are private in the public API.
	-D RADIOLIB_GODMODE=1
	; US 915 bench; kept off Meshtastic's default US slots (e.g. 906.875) so no mesh traffic
	; reaches the receiver - damaged foreign headers are reported to feed the accumulator too.
	-D PROBE_FREQ_MHZ=915.0f
	-D PROBE_SF=7
	-D PROBE_BW_KHZ=500.0f
	-D PROBE_BW_CODE=RADIOLIB_LR2021_LORA_BW_500
	-D PROBE_POWER_DBM=10

[platformio]
default_envs = rx_xiao, tx_xiao

[role_rx]
build_flags = -D PROBE_ROLE_RX=1
[role_tx]
build_flags = -D PROBE_ROLE_TX=1

; ---- Semtech LR2021 LoRa Plus EVK: Seeed XIAO nRF54L15 + LoRa Plus expansion board + Wio-LR2021 ----
[xiao]
; The out-of-tree platform and s145 SoftDevice Arduino core meshtastic/firmware builds this board with.
platform = https://github.com/meshtastic/platform-nordicnrf54.git#v0.3.1
board = xiao_nrf54l15
; Flashed over the XIAO's on-board CMSIS-DAP probe. firmware.hex already carries the bootloader and
; SoftDevice, so a single pyocd load is the whole image. With two kits attached pyocd needs the
; probe's unique ID (pyocd list); the IDs in the envs below are this bench's. upload_command rather
; than upload_flags because the platform puts upload_flags ahead of pyocd's subcommand.
upload_protocol = custom
build_src_filter = +<*> +<../variants/xiao_nrf54l15_lr2021>
build_flags =
	-I variants/xiao_nrf54l15_lr2021
	-D PROBE_BOARD_XIAO_NRF54_LR2021=1
	; 32 MHz crystal, no TCXO: what meshtastic/firmware runs this module with (usp_zephyr's
	; devicetree says 1.8 V TCXO; begin() fails outright if the clock setting is wrong).
	-D PROBE_TCXO_V=0.0f

[env:rx_xiao]
extends = xiao
build_flags = ${env.build_flags} ${xiao.build_flags} ${role_rx.build_flags}
upload_command = pyocd load --target nrf54l --erase sector --uid 07C3FE71 $SOURCE

[env:tx_xiao]
extends = xiao
build_flags = ${env.build_flags} ${xiao.build_flags} ${role_tx.build_flags}
upload_command = pyocd load --target nrf54l --erase sector --uid 831FA71C $SOURCE

; Bit-3 follow-on (optional): the same TX kit sending one 0x09 frame instead of P2..P5.
[env:tx_xiao_bit3]
extends = env:tx_xiao
build_flags = ${env:tx_xiao.build_flags} -D PROBE_SEQUENCE_BIT3=1

; ---- ST Nucleo host (Semtech LR2021 EVK shield on the Arduino headers) ----
[nucleo]
platform = ststm32
board = nucleo_l476rg
build_flags = -D PROBE_BOARD_EVK_NUCLEO=1 -D PROBE_TCXO_V=1.6f

[env:rx_nucleo]
extends = nucleo
build_flags = ${env.build_flags} ${nucleo.build_flags} ${role_rx.build_flags}

[env:tx_nucleo]
extends = nucleo
build_flags = ${env.build_flags} ${nucleo.build_flags} ${role_tx.build_flags}

; ---- ESP32-S3 host (generic devkit wired to an LR2021 module) ----
[esp32s3]
; Pinned: a bare "espressif32" resolves to the newest registry release, which can require a
; newer PlatformIO Core than is installed (55.3.312 needs Core >=6.2.0).
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
build_flags = -D PROBE_BOARD_ESP32S3_GENERIC=1 -D PROBE_TCXO_V=1.6f

[env:rx_esp32s3]
extends = esp32s3
build_flags = ${env.build_flags} ${esp32s3.build_flags} ${role_rx.build_flags}

[env:tx_esp32s3]
extends = esp32s3
build_flags = ${env.build_flags} ${esp32s3.build_flags} ${role_tx.build_flags}
